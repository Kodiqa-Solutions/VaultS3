{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vaults3.fullname" . }}
  labels:
    {{- include "vaults3.labels" . | nindent 4 }}
type: Opaque
data:
  access-key: {{ .Values.auth.accessKey | b64enc | quote }}
  {{- if .Values.auth.secretKey }}
  secret-key: {{ .Values.auth.secretKey | b64enc | quote }}
  {{- else }}
  {{/* Auto-generate on first install; preserve across upgrades via lookup. */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "vaults3.fullname" .) }}
  {{- if and $existing $existing.data (index $existing.data "secret-key") }}
  secret-key: {{ index $existing.data "secret-key" | quote }}
  {{- else }}
  secret-key: {{ randAlphaNum 40 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{/* The cluster secret authenticates node-to-node calls. It used to be the
       admin secret itself, so whoever could read inter-node traffic or a node's
       environment had the admin password. An upgraded release keeps the value
       it was already using (its admin secret), so nodes that agree keep
       agreeing during the rollout. Set auth.clusterSecret to separate them. */}}
  {{- if .Values.auth.clusterSecret }}
  cluster-secret: {{ .Values.auth.clusterSecret | b64enc | quote }}
  {{- else }}
  {{- $prev := lookup "v1" "Secret" .Release.Namespace (include "vaults3.fullname" .) }}
  {{- if and $prev $prev.data (index $prev.data "cluster-secret") }}
  cluster-secret: {{ index $prev.data "cluster-secret" | quote }}
  {{- else if and $prev $prev.data (index $prev.data "secret-key") }}
  cluster-secret: {{ index $prev.data "secret-key" | quote }}
  {{- else }}
  cluster-secret: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
