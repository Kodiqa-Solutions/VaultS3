# Default values for the VaultS3 Helm chart.
# This is a YAML-formatted file. Override with `--set key=value` or `-f my-values.yaml`.

# controller.kind selects the workload type:
#   StatefulSet (default) — stable per-pod identity + PVCs via volumeClaimTemplates;
#                           REQUIRED for clustering and any multi-replica setup.
#   Deployment            — single-node only. Mounts standalone PVCs (which may be
#                           an existing/restored claim, see persistence.*.existingClaim),
#                           which is handy for backup/restore with Velero, k8up, etc.
#                           Incompatible with cluster.enabled and replicaCount > 1.
controller:
  kind: StatefulSet

# replicaCount: keep at 1 unless you have configured Raft clustering (StatefulSet
# only; Beta — see README). Each StatefulSet replica gets its own PVCs and is an
# independent single-node store otherwise.
replicaCount: 1

image:
  repository: eniz1806/vaults3
  # Defaults to the chart's appVersion when empty. Pin to a tag (e.g. "4.4.48")
  # for reproducible deploys; "latest" follows main.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Admin credentials. These are injected as VAULTS3_ACCESS_KEY / VAULTS3_SECRET_KEY
# env vars (which override the config file), so they never live in the ConfigMap.
auth:
  accessKey: "vaults3-admin"
  # Left empty by default, so `helm install` generates a random secret on first
  # install and preserves it across upgrades. Set it to pin your own. A secret
  # shipped in a values file is not a secret: it is published wherever the chart
  # is.
  #
  # Read the generated one with:
  #   kubectl get secret <release> -o jsonpath='{.data.secret-key}' | base64 -d
  secretKey: ""
  # Use an existing Secret instead of the chart-managed one. The Secret must
  # contain keys `access-key` and `secret-key`.
  existingSecret: ""

# The vaults3.yaml mounted at /etc/vaults3/vaults3.yaml. Data/metadata dirs are
# forced to the PVC mount paths via env vars regardless of what's set here.
# Replace wholesale to enable encryption, replication, erasure, etc.
# Set existingConfigMap to use your own ConfigMap (key: vaults3.yaml) instead.
existingConfigMap: ""
config: |
  server:
    address: "0.0.0.0"
    port: 9000
    shutdown_timeout_secs: 30
  storage:
    data_dir: "/data"
    metadata_dir: "/metadata"
  auth:
    # Overridden at runtime by VAULTS3_ACCESS_KEY / VAULTS3_SECRET_KEY (from the
    # Secret above), so this is deliberately left empty rather than repeating a
    # credential here.
    admin_access_key: "vaults3-admin"
    admin_secret_key: ""
  compression:
    enabled: false
  # Per-IP limits key on the connection address, and behind an ingress every
  # client shares it, so the ceiling is set well above real traffic.
  rate_limit:
    enabled: true
    requests_per_sec: 2000
    burst_size: 4000
    per_key_rps: 2000
    per_key_burst: 4000

# Buckets created on startup if they are missing, so the release needs no init
# container or S3 client to get its first bucket. Existing buckets are left
# untouched; an invalid name stops the pod with a clear error.
defaultBuckets: []
  # - app-data
  # - backups

# How often, at most, VaultS3 re-measures its own on-disk footprint by walking its
# data directories. That is what lets the dashboard and `vaults3-cli info` separate
# "VaultS3 is using this much" from the node's total filesystem usage, which on a
# shared volume also counts the OS, container images and logs. The walk is
# background-only and on demand. Set to 0 to switch it off on very large volumes.
usageScanIntervalSecs: 300

service:
  type: ClusterIP
  port: 9000
  # annotations for the ClusterIP service (e.g. for a LoadBalancer)
  annotations: {}

# Multi-node Raft clustering (BETA). When enabled, the StatefulSet auto-forms a
# cluster: pod-0 bootstraps as the initial leader and the other pods auto-join it
# (no manual bootstrap/join steps), and a pod that restarts with a new IP
# re-announces itself automatically. Set replicaCount to an ODD number >= 3 for a
# fault-tolerant quorum (3 tolerates 1 node loss).
#
# Metadata writes are replicated across nodes via Raft consensus (a write to any
# node is forwarded to the leader and committed), so the cluster stays consistent.
# With metadataShards at 1 that means EVERY pod holds a complete copy of the
# metadata (object data is sharded across pods, metadata is not), which is what
# caps the object count per cluster: budget about 600 bytes of metadata per object
# per pod. See docs/SCALING.md.
# BETA: functional but newer/less battle-tested than single-node + erasure coding;
# for maximum production durability prefer a single node with erasure coding.
cluster:
  enabled: false
  raftPort: 9001
  # Metadata sharding. Above 1, object metadata is split across that many
  # independent Raft groups and each pod holds only the shards it is a member of,
  # so metadata capacity grows with the cluster instead of being copied to every
  # pod. Read docs/design/sharded-metadata.md before enabling it:
  #   - the shard count is FIXED once the cluster commits its assignment, because
  #     buckets hash to a shard. There is no resharding.
  #   - it cannot be enabled on a cluster that already holds objects; the pods
  #     refuse to start rather than hide the metadata already written.
  #   - the cluster needs at least metadataReplicas pods before the assignment can
  #     be created, so replicaCount must be >= metadataReplicas.
  metadataShards: 1
  metadataReplicas: 3

ingress:
  enabled: false
  className: ""
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-body-size: "0"   # allow large object uploads
  hosts:
    - host: vaults3.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: vaults3-tls
    #   hosts:
    #     - vaults3.local

# Persistent storage. VaultS3 keeps object data and BoltDB metadata on disk, so
# persistence should stay enabled for any real use. StatefulSet mode creates a PVC
# per replica via volumeClaimTemplates. Deployment mode (controller.kind:
# Deployment) creates standalone PVCs — or, set existingClaim to mount a PVC you
# already created (e.g. one restored from a Velero/k8up backup). existingClaim is
# honoured only in Deployment mode.
persistence:
  enabled: true
  data:
    size: 50Gi
    existingClaim: ""         # mount this pre-existing PVC instead of creating one (Deployment mode)
    # storageClass: ""        # "" = cluster default; "-" = disable dynamic provisioning
    accessModes:
      - ReadWriteOnce
  metadata:
    size: 5Gi
    existingClaim: ""
    # storageClass: ""
    accessModes:
      - ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Probes hit the public /health (liveness) and /ready (readiness) endpoints.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Pod- and container-level security. The image already runs as UID/GID 1000;
# fsGroup makes the mounted PVCs writable by that user.
podSecurityContext:
  fsGroup: 1000
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Prometheus Operator ServiceMonitor for the /metrics endpoint.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# PodDisruptionBudget (useful once you run >1 replica).
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Extra environment variables (e.g. VAULTS3_LOG_LEVEL, VAULTS3_DOMAIN,
# VAULTS3_ENCRYPTION_KEY). See the README for the full list.
extraEnv: []
  # - name: VAULTS3_LOG_LEVEL
  #   value: "info"

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
