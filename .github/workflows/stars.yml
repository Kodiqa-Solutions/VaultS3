name: README stars

# Keeps the GitHub stars row of the README comparison table current. It only
# edits README.md, which ci.yml ignores, so it never rebuilds the image.
on:
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-stars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read star counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_stars.py

      - name: Commit if a figure changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Update GitHub star counts in the README'
          git pull --rebase origin main
          git push origin HEAD:main
