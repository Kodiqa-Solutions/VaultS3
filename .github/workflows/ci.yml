name: CI

# Documentation-only changes skip this workflow entirely. Nothing here reads a
# markdown file: no .md is embedded in the binary (checked), none is copied into
# the image, and no job publishes DOCKERHUB.md. Before this filter a README edit
# ran the full build, test, vulncheck and lint, and then republished
# eniz1806/vaults3:latest, handing every `:latest` user a new image digest for a
# change to a sentence. The docs now live in docs/ as separate files, so doc-only
# commits are common rather than rare.
#
# Kept deliberately narrow: only prose and images. deploy/ is NOT excluded, since
# a chart is infrastructure and a future helm-lint job should run against it.
#
# Safe because main has no branch protection and no required status checks, so a
# skipped run cannot strand a pull request waiting for a check that never reports.
# If required checks are ever turned on, this needs the companion-workflow pattern
# instead, or a docs-only PR will block forever.
on:
  push:
    branches: [main]
    tags: ['v*']
    # Listed twice rather than via a YAML anchor: GitHub Actions does not
    # officially support anchors in workflow files, and a silently mis-parsed
    # trigger is a worse outcome than seven duplicated lines. Keep the two lists
    # identical.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Run frontend tests
        run: cd web && npm run test

      - name: Build frontend
        run: |
          cd web && npm run build
          cd ..
          rm -rf internal/dashboard/dist
          cp -r web/dist internal/dashboard/dist

      - name: Build Go binaries
        run: |
          go build -o vaults3 ./cmd/vaults3
          go build -o vaults3-cli ./cmd/vaults3-cli

      - name: Run tests with race detection and coverage
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend for embed
        run: |
          cd web && npm ci && npm run build
          cd ..
          rm -rf internal/dashboard/dist
          cp -r web/dist internal/dashboard/dist

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      # go vet catches a narrow set of issues. golangci-lint is the deeper pass
      # the Makefile target already used locally, which nothing enforced.
      #
      # Reporting only, deliberately. It currently finds 77 issues, 50 of them
      # unchecked error returns, and failing the build on all of them at once
      # would just mean the job gets ignored. The findings are visible in the log
      # so they can be worked down, and this becomes blocking once the count is
      # zero. Unchecked errors are not cosmetic here: issue #50's data loss was
      # a discarded error return that reported success.
      #
      # Version pinned rather than latest, so a new release adding a linter
      # cannot turn CI red without anyone changing anything.
      - name: Run golangci-lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
          args: --timeout=5m

  # Go's own vulnerability scanner. Dependabot compares manifests, which is why
  # it has twice missed real issues here. govulncheck analyses whether the
  # vulnerable code is actually reachable from this codebase, so it reports
  # fewer false alarms and catches things a manifest diff does not see.
  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run govulncheck
        run: govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: eniz1806/vaults3
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
